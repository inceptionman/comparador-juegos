<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Comparador de Precios</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.10/htmx.min.js"></script>
    <style>
        :root {
            --fondo: #0e0e0e;
            --superficie: #1a1a1a;
            --superficie-2: #242424;
            --borde: #2f2f2f;
            --verde: #107c10;
            --verde-hover: #159a15;
            --lima: #9bf00b;
            --rojo: #c42b1c;
            --rojo-hover: #e03e2e;
            --texto: #ffffff;
            --texto-suave: #a6a6a6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--fondo);
            color: var(--texto);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--superficie);
            border-bottom: 1px solid var(--borde);
            padding: 18px 24px;
            z-index: 10;
        }
        header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: .3px;
        }
        header h1 span { color: var(--lima); }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 32px;
        }

        .auth-title {
            margin: 0 0 8px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .auth-subtitle {
            margin: 0 0 24px;
            color: var(--texto-suave);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--texto);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            color: var(--texto);
            background: var(--superficie-2);
            border: 1px solid var(--borde);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: var(--texto-suave); }
        input:focus { border-color: var(--verde-hover); box-shadow: 0 0 0 1px var(--verde-hover); }
        input.error { border-color: var(--rojo); }

        .error-message {
            display: none;
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--rojo);
        }
        .error-message.visible { display: block; }

        .btn {
            width: 100%;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--texto);
            background: var(--verde);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background: var(--verde-hover); }
        .btn:disabled { background: #3a3a3a; color: var(--texto-suave); cursor: not-allowed; }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--texto-suave);
        }
        .auth-link a {
            color: var(--lima);
            text-decoration: none;
            font-weight: 500;
        }
        .auth-link a:hover { text-decoration: underline; }

        .global-error {
            display: none;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: rgba(196, 43, 28, 0.2);
            border: 1px solid var(--rojo);
            border-radius: 4px;
            color: var(--rojo);
            font-size: 0.9rem;
        }
        .global-error.visible { display: block; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Comparador de <span>Precios</span></h1>
    </header>

    <main class="auth-container">
        <h2 class="auth-title">Iniciar sesión</h2>
        <p class="auth-subtitle">Accede a tu lista de deseos y seguimiento de precios</p>

        <div id="global-error" class="global-error"></div>

        <form id="login-form" hx-post="/api/auth/login" hx-target="#global-error" hx-swap="innerHTML">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@email.com">
                <div class="error-message" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña">
                <div class="error-message" id="password-error"></div>
            </div>

            <button type="submit" class="btn" id="submit-btn">Iniciar sesión</button>
        </form>

        <p class="auth-link">
            ¿No tienes cuenta? <a href="/api/auth/register">Regístrate</a>
        </p>
    </main>

    <script>
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const globalError = document.getElementById('global-error');

        function showFieldError(fieldId, message) {
            const input = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + '-error');
            input.classList.add('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('visible');
        }

        function clearFieldError(fieldId) {
            const input = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + '-error');
            input.classList.remove('error');
            errorDiv.classList.remove('visible');
        }

        function showGlobalError(message) {
            globalError.textContent = message;
            globalError.classList.add('visible');
        }

        function clearGlobalError() {
            globalError.classList.remove('visible');
        }

        ['email', 'password'].forEach(field => {
            const input = document.getElementById(field);
            input.addEventListener('input', () => clearFieldError(field));
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearGlobalError();
            ['email', 'password'].forEach(clearFieldError);

            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            submitBtn.disabled = true;
            submitBtn.textContent = 'Iniciando sesión...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    credentials: 'include'
                });

                const result = await response.json();

                if (!response.ok) {
                    if (result.detail) {
                        showGlobalError(result.detail);
                    } else {
                        showGlobalError('Error al iniciar sesión. Intenta de nuevo.');
                    }
                    return;
                }

                window.location.href = '/';
            } catch (error) {
                showGlobalError('Error de conexión. Intenta de nuevo.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Iniciar sesión';
            }
        });
    </script>
</body>
</html>
