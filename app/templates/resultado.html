{% if resultado %}
    <h2 class="titulo-juego">{{ resultado.nombre }}</h2>
    <table class="tabla-ofertas">
        <tr><th>Tienda</th><th>Precio</th></tr>
        {% for oferta in resultado.ofertas %}
        <tr class="{{ 'mejor' if loop.first else '' }}">
            <td>
                {{ oferta.shop.name }}
                {% if loop.first %}<span class="insignia">Mejor precio</span>{% endif %}
            </td>
            <td class="precio">{{ '%.2f'|format(oferta.price.amount) }} {{ oferta.price.currency }}</td>
        </tr>
        {% endfor %}
    </table>
{% elif mensaje %}
    <p class="mensaje">{{ mensaje }}</p>
{% endif %}
