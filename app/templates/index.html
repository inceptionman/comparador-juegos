<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparador de Precios de Videojuegos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.10/htmx.min.js"></script>
    <style>
        :root {
            --fondo: #0e0e0e;
            --superficie: #1a1a1a;
            --superficie-2: #242424;
            --borde: #2f2f2f;
            --verde: #107c10;
            --verde-hover: #159a15;
            --lima: #9bf00b;
            --texto: #ffffff;
            --texto-suave: #a6a6a6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--fondo);
            color: var(--texto);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        header {
            background: var(--superficie);
            border-bottom: 1px solid var(--borde);
            padding: 18px 24px;
        }
        header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: .3px;
        }
        header h1 span { color: var(--lima); }

        main {
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .buscador { position: relative; }
        .barra { display: flex; gap: 10px; }

        .barra input {
            flex: 1;
            padding: 12px 14px;
            font-size: 1rem;
            color: var(--texto);
            background: var(--superficie-2);
            border: 1px solid var(--borde);
            border-radius: 4px;
            outline: none;
        }
        .barra input::placeholder { color: var(--texto-suave); }
        .barra input:focus { border-color: var(--verde-hover); box-shadow: 0 0 0 1px var(--verde-hover); }

        .barra button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--texto);
            background: var(--verde);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .barra button:hover { background: var(--verde-hover); }

        /* Lista desplegable de sugerencias */
        .lista-sugerencias {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 10;
            margin: 4px 0 0;
            padding: 4px 0;
            list-style: none;
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .6);
        }
        .lista-sugerencias li {
            padding: 10px 14px;
            cursor: pointer;
        }
        .lista-sugerencias li:hover,
        .lista-sugerencias li.activo {
            background: var(--superficie-2);
            box-shadow: inset 3px 0 0 var(--lima);
        }

        /* Resultados */
        #resultado { margin-top: 32px; }
        .titulo-juego { margin: 0 0 16px; font-size: 1.5rem; font-weight: 600; }

        .tabla-ofertas {
            width: 100%;
            border-collapse: collapse;
            background: var(--superficie);
            border-radius: 6px;
            overflow: hidden;
        }
        .tabla-ofertas th {
            text-align: left;
            padding: 12px 16px;
            font-size: .8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--texto-suave);
            background: var(--superficie-2);
        }
        .tabla-ofertas td {
            padding: 14px 16px;
            border-top: 1px solid var(--borde);
        }
        .tabla-ofertas td.precio { font-variant-numeric: tabular-nums; }
        .tabla-ofertas tr:hover td { background: #202020; }

        .tabla-ofertas tr.mejor td {
            background: rgba(16, 124, 16, .22);
            font-weight: 600;
        }
        .tabla-ofertas tr.mejor td.precio { color: var(--lima); }
        .tabla-ofertas tr.mejor td:first-child { box-shadow: inset 3px 0 0 var(--lima); }

        .insignia {
            margin-left: 10px;
            padding: 2px 8px;
            font-size: .7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #0e0e0e;
            background: var(--lima);
            border-radius: 3px;
        }

        .mensaje { color: var(--texto-suave); }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Comparador de <span>Precios</span></h1>
    </header>

    <main>
        <div class="buscador">
            <form id="form-busqueda" hx-get="/buscar" hx-target="#resultado" hx-swap="innerHTML">
                <div class="barra">
                    <input type="text" id="q" name="q" autocomplete="off" required
                           placeholder="Nombre del juego (ej. Elden Ring)"
                           hx-get="/sugerencias"
                           hx-trigger="input changed delay:300ms"
                           hx-target="#sugerencias"
                           hx-swap="innerHTML"
                           hx-sync="this:replace">
                    <button type="submit">Buscar</button>
                </div>
            </form>
            <div id="sugerencias"></div>
        </div>

        <div id="resultado">
            {% if resultado %}
                {% include 'resultado.html' %}
            {% elif mensaje %}
                {% include 'resultado.html' %}
            {% endif %}
        </div>
    </main>

    <script>
        const form = document.getElementById('form-busqueda');
        const input = document.getElementById('q');
        const lista = document.getElementById('sugerencias');
        let activo = -1;

        function cerrar() { lista.innerHTML = ''; activo = -1; }

        // Click en una sugerencia: rellena el buscador y lanza la búsqueda
        lista.addEventListener('click', (e) => {
            const item = e.target.closest('[data-titulo]');
            if (!item) return;
            input.value = item.dataset.titulo;
            cerrar();
            form.requestSubmit();
        });

        // Teclado: flechas, Enter y Escape
        input.addEventListener('keydown', (e) => {
            const items = [...lista.querySelectorAll('[data-titulo]')];
            if (!items.length) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                activo = (activo + 1) % items.length;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                activo = (activo - 1 + items.length) % items.length;
            } else if (e.key === 'Enter' && activo >= 0) {
                e.preventDefault();
                items[activo].click();
                return;
            } else if (e.key === 'Escape') {
                cerrar();
                return;
            } else {
                return;
            }
            items.forEach((el, i) => el.classList.toggle('activo', i === activo));
        });

        // Cuando llegan sugerencias nuevas, se reinicia la selección con teclado
        lista.addEventListener('htmx:afterSwap', () => { activo = -1; });

        // Cerrar al enviar el formulario o al hacer click fuera del buscador
        form.addEventListener('submit', cerrar);
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.buscador')) cerrar();
        });
    </script>
</body>
</html>
